import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        compileSdk = 35
        // layout inspection supported starting on Android Q
        minSdk = 29
        namespace = "androidx.compose.ui.inspection"
    }
    jvm()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                implementation(project(":collection:collection"))
                implementation(project(":compose:runtime:runtime"))
                implementation(project(":compose:ui:ui"))
            }
        }

        commonTest {
            dependencies {
                implementation(libs.kotlinTest)
            }
        }

        jvmAndAndroidMain {
            dependencies {
                implementation(libs.kotlinReflect)
            }
        }

        androidMain {
            dependencies {
                implementation("androidx.annotation:annotation:1.8.1") {
                    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
                }
                // Following dependencies will be provided by inspected app itself
                // because compose:ui-inspector can be run only in app with compose:ui:ui
                // thus all its transitive dependencies will be present too.
                implementation(libs.protobufLite)
                compileOnly(libs.kotlinCoroutinesAndroid)
                compileOnly("androidx.collection:collection:1.4.2")
                compileOnly(androidx.projectOrArtifact(":inspection:inspection"))
                compileOnly(project(":compose:runtime:runtime"))
                compileOnly(project(":compose:ui:ui-graphics"))
                compileOnly(project(":compose:ui:ui"))
                // we ignore its transitive dependencies, because ui-inspection should
                // depend on them as "compile-only" deps.
                implementation(project(":compose:ui:ui-tooling-data")) {
                    transitive = false
                }
            }
            kotlin.srcDirs += "src/androidMain/java"
            resources.srcDirs += [
                    "src/androidMain/proto",
                    "src/androidMain/resources"
            ]
        }

        androidDeviceTest {
            dependencies {
                implementation(libs.kotlinCoroutinesAndroid)
                implementation(libs.testCore)
                implementation(project(":compose:foundation:foundation-layout"))
                implementation(project(":compose:ui:ui-tooling"))
                implementation(project(":compose:ui:ui-tooling-data"))
                implementation(project(":compose:ui:ui"))
                implementation(project(":compose:foundation:foundation"))
                implementation(project(":compose:ui:ui-util"))
                implementation(project(":compose:ui:ui-test-junit4"))
                implementation(project(":internal-testutils-fonts"))
                implementation(project(":compose:material:material"))
                implementation("androidx.compose.material:material-icons-core:1.6.7")
                implementation("androidx.compose.material3:material3-android:1.3.1")
                def inspectionTesting = project.findProject(":inspection:inspection-testing")
                if (inspectionTesting != null) {
                    implementation(inspectionTesting)
                }
                implementation("androidx.activity:activity-compose:1.3.1")
                implementation(libs.testRunner)
                implementation(libs.testRules)
                implementation(libs.testExtJunit)
                implementation(libs.espressoCore)
                implementation(libs.truth)
            }
            kotlin.srcDirs += "src/androidDeviceTest/java"
            resources.srcDirs += "src/androidDeviceTest/res"
        }
    }
}

androidx {
    name = "Compose Layout Inspector"
    type = SoftwareType.IDE_PLUGIN
    inceptionYear = "2021"
    description = "Compose layout inspector. Exposes information to our tools for better IDE support."
}

// TODO(b/407640608): Fix :compose:ui:ui-inspection:connectedCheck to work without this block
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += [
                "-Xlambdas=class"
        ]
    }
}
