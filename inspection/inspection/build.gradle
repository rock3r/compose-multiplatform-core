import androidx.build.SoftwareType
import java.util.Properties

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("com.android.experimental.built-in-kotlin")
}

dependencies {
    api(libs.jspecify)
    api("androidx.annotation:annotation:1.8.1")
    androidTestImplementation(libs.testCore)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.truth)
    androidTestImplementation(libs.junit)
}

androidx {
    name = "Inspection"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2019"
    description = "Experimental AndroidX Inspection Project"
    legacyDisableKotlinStrictApiMode = true
    doNotDocumentReason = "Not shipped externally"
}

def hasConfiguredNdk() {
    def sdkDirPath = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME")
    if (sdkDirPath == null) {
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
            sdkDirPath = localProperties.getProperty("sdk.dir")
        }
    }
    if (sdkDirPath == null) {
        return false
    }
    def sdkDir = new File(sdkDirPath)
    def ndkBundle = new File(sdkDir, "ndk-bundle")
    if (new File(ndkBundle, "source.properties").exists()) {
        return true
    }
    def ndkRoot = new File(sdkDir, "ndk")
    if (!ndkRoot.exists()) {
        return false
    }
    if (new File(ndkRoot, "source.properties").exists()) {
        return true
    }
    return (ndkRoot.listFiles() ?: []).any { candidate ->
        new File(candidate, "source.properties").exists()
    }
}

android {
    defaultConfig {
        // studio pipeline works only starting with Android O
        minSdk = 26
    }

    if (hasConfiguredNdk()) {
        externalNativeBuild {
            cmake {
                path "src/main/native/CMakeLists.txt"
                version = libs.versions.cmake.get()
            }
        }
    } else {
        logger.lifecycle("Skipping inspection native build; no Android NDK found")
    }

    namespace = "androidx.inspection"
}
